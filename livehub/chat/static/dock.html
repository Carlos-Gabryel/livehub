<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat global</title>
<style>
  :root { --bg:#0e0e10; --panel:#18181b; --fg:#efeff1; --mut:#898990; --tw:#9146ff; --yt:#ff3b3b; --kk:#53fc18; --tt:#25f4ee; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:14px/1.4 system-ui,"Segoe UI",Roboto,sans-serif; }
  #bar { display:flex; gap:12px; align-items:center; height:28px; padding:0 10px; background:var(--panel);
    color:var(--mut); border-bottom:1px solid #26262c; white-space:nowrap; }
  #bar span { position:relative; flex:none; width:16px; height:16px; color:var(--c); }
  #bar span > * { display:block; width:16px; height:16px; opacity:.45; }
  #bar span svg { fill:currentColor; }
  #bar span.on > *, #bar span.off > * { opacity:1; }
  #bar span::before { content:""; position:absolute; z-index:1; right:-3px; bottom:-3px; width:7px; height:7px; border-radius:50%;
    background:#666; box-shadow:0 0 0 1.5px var(--panel); }
  #bar .on::before { background:#3ddc84; } #bar .off::before { background:#e5484d; }
  #wrap { position:relative; height:calc(100% - 28px); }
  #log { height:100%; overflow-y:auto; padding:6px 0; }
  .m { display:flex; gap:6px; align-items:flex-start; padding:3px 10px 3px 8px; border-left:3px solid var(--c);
    word-break:break-word; }
  .m:hover { background:#1c1c21; }
  .m.event { background:#1f1a2b; font-style:italic; }
  .m.first { background:#17261d; }
  .tw { --c:var(--tw); } .yt { --c:var(--yt); } .kk { --c:var(--kk); } .tt { --c:var(--tt); }
  .ic { flex:none; width:16px; height:16px; margin-top:2px; border-radius:3px; background:var(--c);
    color:#000; font:700 10px/16px system-ui; text-align:center; }
  .body { min-width:0; }
  .badge { height:16px; width:16px; vertical-align:-3px; margin-right:3px; }
  .u { font-weight:700; margin-right:4px; }
  .u::after { content:":"; font-weight:400; color:var(--mut); }
  .emote { height:1.7em; vertical-align:middle; margin:-2px 1px; }
  .me .t { font-style:italic; }
  #more { display:none; position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
    background:var(--tw); color:#fff; border:0; border-radius:16px; padding:6px 14px; cursor:pointer;
    font:600 12px system-ui; box-shadow:0 2px 8px #000a; }
  #empty { color:var(--mut); text-align:center; margin-top:30px; }
</style>
</head>
<body>
<div id="bar"><span id="s-twitch" class="tw" title="Twitch" aria-label="Twitch"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg></span><span id="s-youtube" class="yt" title="YouTube" aria-label="YouTube"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg></span><span id="s-kick" class="kk" title="Kick" aria-label="Kick"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.333 0h8v5.333H12V2.667h2.667V0h8v8H20v2.667h-2.667v2.666H20V16h2.667v8h-8v-2.667H12v-2.666H9.333V24h-8Z"/></svg></span><span id="s-tiktok" class="tt" title="TikTok" aria-label="TikTok"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg></span></div>
<div id="wrap"><div id="log"><div id="empty">Aguardando mensagens...</div></div>
<button id="more">Novas mensagens &#8595;</button></div>
<script>
const log = document.getElementById('log'), more = document.getElementById('more');
const CLS = {twitch:'tw', youtube:'yt', kick:'kk', tiktok:'tt'}, ICON = {twitch:'T', youtube:'Y', kick:'K', tiktok:'TT'};
const NOME = {twitch:'Twitch', youtube:'YouTube', kick:'Kick', tiktok:'TikTok'};
const MAX = 500;
let stick = true;

const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 40;
log.addEventListener('scroll', () => { stick = atBottom(); if (stick) more.style.display = 'none'; });
more.onclick = () => { log.scrollTop = log.scrollHeight; stick = true; more.style.display = 'none'; };

function safeUrl(u) { return typeof u === 'string' && /^https:\/\//.test(u) ? u : null; }

function render(m) {
  const e = document.getElementById('empty'); if (e) e.remove();
  const row = document.createElement('div');
  row.className = 'm ' + CLS[m.platform] + (m.event ? ' event' : '') + (m.first ? ' first' : '') + (m.me ? ' me' : '');
  row.dataset.id = m.id || ''; row.dataset.uid = m.user_id || ''; row.dataset.platform = m.platform;
  const ic = document.createElement('div'); ic.className = 'ic'; ic.textContent = ICON[m.platform]; ic.title = m.platform;
  const body = document.createElement('div'); body.className = 'body';
  for (const b of m.badges || []) {
    const u = safeUrl(b.url); if (!u) continue;
    const i = document.createElement('img'); i.className = 'badge'; i.src = u; i.title = b.title || ''; body.appendChild(i);
  }
  const u = document.createElement('span'); u.className = 'u'; u.textContent = m.user;
  u.style.color = m.color || (m.owner ? '#ffd33d' : m.mod ? '#5ec8ff' : '#d0d0d6');
  body.appendChild(u);
  const t = document.createElement('span'); t.className = 't';
  for (const p of m.parts || []) {
    if (p.t === 'emote' && safeUrl(p.url)) {
      const i = document.createElement('img'); i.className = 'emote'; i.src = p.url; i.alt = p.name; i.title = p.name; t.appendChild(i);
    } else t.appendChild(document.createTextNode(p.v ?? p.name ?? ''));
  }
  body.appendChild(t); row.append(ic, body);
  return row;
}

function add(m) {
  const was = stick;
  log.appendChild(render(m));
  while (log.children.length > MAX) log.removeChild(log.firstChild);
  if (was) log.scrollTop = log.scrollHeight; else more.style.display = 'block';
}

function setStatus(st) {
  for (const k of ['twitch', 'kick', 'youtube', 'tiktok']) {
    const el = document.getElementById('s-' + k); if (!el || !st[k]) continue;
    el.className = CLS[k] + ' ' + (/^conectado/.test(st[k]) ? 'on' : (/reconect|erro/.test(st[k]) ? 'off' : ''));
    el.title = NOME[k] + ': ' + st[k];
  }
}

function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/dock/ws');
  ws.onmessage = ev => {
    const d = JSON.parse(ev.data);
    if (d.type === 'history') { log.replaceChildren(); d.messages.forEach(add); setStatus(d.status); stick = true; log.scrollTop = log.scrollHeight; }
    else if (d.type === 'msg') add(d.msg);
    else if (d.type === 'status') setStatus(d.status);
    else if (d.type === 'delete') log.querySelectorAll('.m').forEach(r => {
      if (r.dataset.platform === d.platform && ((d.id && r.dataset.id === d.id) || (d.user_id && r.dataset.uid === d.user_id))) r.remove(); });
    else if (d.type === 'clear') log.querySelectorAll('.m').forEach(r => { if (r.dataset.platform === d.platform) r.remove(); });
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();
</script>
</body>
</html>
