  #bar a svg { display:block; width:16px; height:16px; fill:currentColor; } #bar a:hover { color:var(--fg); }
  #log { height:calc(100% - 28px); overflow-y:auto; padding:6px 0; }
  .m { display:flex; gap:6px; align-items:flex-start; padding:4px 10px 4px 8px; border-left:3px solid var(--c); word-break:break-word; }
  .m:hover { background:#1c1c21; }
  .tw { --c:var(--tw); } .yt { --c:var(--yt); } .kk { --c:var(--kk); } .tt { --c:var(--tt); } .se { --c:var(--se); }
  .ic { flex:none; width:16px; height:16px; margin-top:2px; border-radius:3px; background:var(--c);
    color:#000; font:700 10px/16px system-ui; text-align:center; }
  .em { flex:none; width:20px; text-align:center; }
  .body { min-width:0; flex:1; }
  .u { font-weight:700; }
  .t { color:var(--mut); }
  .v { color:#ffd33d; font-weight:700; }
  .d { display:block; font-size:12px; color:var(--mut); }
  .rp { flex:none; align-self:flex-start; width:20px; height:20px; padding:0; border:0; border-radius:4px; background:none; color:var(--mut);
    font:14px/20px system-ui; cursor:pointer; opacity:0; }
  .m:hover .rp, .rp:focus-visible { opacity:1; } .rp:hover { color:var(--fg); background:#26262c; } .rp.ok { color:#3ddc84; opacity:1; }
  .h { flex:none; font-size:11px; color:var(--mut); margin-top:2px; }
  #empty { color:var(--mut); text-align:center; margin-top:30px; }

<div id="log"><div id="empty">Aguardando interações...</div></div>
<script>
const log = document.getElementById('log');
const CLS = {twitch:'tw', youtube:'yt', kick:'kk', tiktok:'tt', streamelements:'se'};
const ICON = {twitch:'T', youtube:'Y', kick:'K', tiktok:'TT', streamelements:'$'};
const NOME = {twitch:'Twitch', youtube:'YouTube', kick:'Kick', tiktok:'TikTok', streamelements:'StreamElements'};
const EMOJI = {'follow':'❤️', 'sub':'⭐', 'presente de sub':'🎁', 'bits':'💎', 'raid':'🚀', 'host':'🚀',
  'super chat':'💰', 'super sticker':'💰', 'membro':'🏅', 'presente de membro':'🏅', 'presente':'🎁',
  'assinatura':'⭐', 'kicks':'💚', 'doação':'💸', 'resgate':'🎟️'};
// tipos que geram alerta (espelha livehub/alertas/regras.py)
const ALERTA = new Set(['follow', 'sub', 'assinatura', 'membro', 'presente de sub', 'presente de membro', 'raid', 'host',
  'bits', 'kicks', 'presente', 'super sticker', 'doação', 'super chat']);
const MAX = 300;

function hora(ts) { const d = new Date(ts * 1000); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function render(m) {
  const row = el('div', 'm ' + (CLS[m.platform] || ''));
  const body = el('div', 'body');
  body.append(el('span', 'u', m.user || '?'), document.createTextNode(' '), el('span', 't', m.tipo || ''));
  if (m.valor) body.append(document.createTextNode(' '), el('span', 'v', m.valor));
  if (m.detalhe) body.append(el('span', 'd', m.detalhe));
  row.append(el('div', 'ic', ICON[m.platform] || '?'), el('div', 'em', EMOJI[m.tipo] || '•'), body);
  if (m.seq && ALERTA.has((m.tipo || '').toLowerCase())) {
    const b = el('button', 'rp', '↻'); b.type = 'button'; b.title = 'Repetir alerta na tela'; b.setAttribute('aria-label', 'Repetir alerta na tela');
    b.onclick = async () => {
      try {
        const r = await fetch('/api/alertas/repetir', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({seq: m.seq})});
        if (r.ok) { b.classList.add('ok'); setTimeout(() => b.classList.remove('ok'), 1200); }
      } catch (e) {}
    };
    row.append(b);
  }
  row.append(el('div', 'h', hora(m.ts)));
  return row;
}

function add(m) {
  const e = document.getElementById('empty'); if (e) e.remove();
  log.prepend(render(m));
  while (log.children.length > MAX) log.removeChild(log.lastChild);
}

function setStatus(st) {
  for (const k of Object.keys(CLS)) {
    const el = document.getElementById('s-' + k); if (!el || !st[k]) continue;
    el.className = CLS[k] + ' ' + (/^conectado/.test(st[k]) ? 'on' : (/reconect|erro|inv/.test(st[k]) ? 'off' : ''));
    el.title = NOME[k] + ': ' + st[k];
  }
}

function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/eventos/ws');
  ws.onmessage = ev => {
    const d = JSON.parse(ev.data);
    if (d.type === 'history') { log.replaceChildren(); d.eventos.forEach(add); setStatus(d.status); }
    else if (d.type === 'ev') add(d.ev);
    else if (d.type === 'status') setStatus(d.status);
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();
</script>
