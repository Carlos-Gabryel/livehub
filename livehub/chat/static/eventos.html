<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interações</title>
<style>
  :root { --bg:#0e0e10; --panel:#18181b; --fg:#efeff1; --mut:#898990; --tw:#9146ff; --yt:#ff3b3b; --kk:#53fc18; --tt:#25f4ee; --se:#f5a623; --lp:#00d26a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
    font:14px/1.4 system-ui,"Segoe UI",Roboto,sans-serif; }
  #bar { display:flex; gap:12px; align-items:center; height:28px; padding:0 10px; background:var(--panel);
    color:var(--mut); border-bottom:1px solid #26262c; white-space:nowrap; }
  #bar span { position:relative; flex:none; width:16px; height:16px; color:var(--c); }
  #bar span > * { display:block; width:16px; height:16px; opacity:.45; }
  #bar span svg { fill:currentColor; }
  #bar span.on > *, #bar span.off > * { opacity:1; }
  #bar span::before { content:""; position:absolute; z-index:1; right:-3px; bottom:-3px; width:7px; height:7px; border-radius:50%;
    background:#666; box-shadow:0 0 0 1.5px var(--panel); }
  #bar .on::before { background:#3ddc84; } #bar .off::before { background:#e5484d; }
  #bar .logo-se { background:currentColor; -webkit-mask:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAALMSURBVFhHxZdJqM5RGMaveR5KhsiUoRAWikLCCikppIRrLGRYYCdJyoYsLLAQiqVYkczsLNiQKFnIWKaQ+afnOkfnPud8vu+i663f4v+8zznnvfd/znv+Xx1Q9z/JhOYmE5pID+Ao0KqQq4lMaCJb+BnzC7mayIQq9ANWAB2BzsCLUMDtkO8DLAO6F8YWyYQK6F99EHgJHANaADvC4jGWAm2B88AzYBfQvjBXIzKhwBzgOXAZmBi0DsBTK+BmMmZmeH4ITCjM+YtMMDYC34E1prcG7lsBVwrjdwLfgHmFXAOZkLA8TDy9kBNnrIBDBY/Qnqg4TyYERoVBcwu5yP5kccXmgiei3Gegp+fcGLkFHCnoKeutAO0V96RcB0667iYxC/gEdCnk3JfG6IInZXjwjUx1N4mL4ci57uyzAjYVPM4F4ECquaEr8Do5bpXoD7y3Ap6E5uTelMXhaKqPNGhumBy6W6fC4JQ9tniMdQVvyjDgDTAgam6oB+4WBjqngVPAjbDwWeBaeC3uTdEfpqY2JWpu2BBOgOvONmAqsCgUoFe2BFhV8KaogT0GZkfNDSuBB4WBjl6V9sFQ4G24A8YG3JuiPfIqbUpuUOIr0KswOCVuonHAB6C36ZWQX6HCGzQ3qFMpdJNFbTDQrTCZ0A2omFbICV3PfZPn4+GUtYmaDxC6VBS6gLRrzwFrCz5xNXg1sefEXuAEMATYGryHU48PEHFjKfQ6FDrjg8y3wHx+7epZr0eheyDGpGoFtAPuJQNiqIEsBEaE4/rO8o/CfaD86rDZPNQJG63ni0dm+Mgk9H3wu6iU/wKM8bV84ZTdPsNfhn/UVC1A6CPjX8T2wtw1FSDU9f40dGFpP/icTSpAqPNd8tmrhO4LfVn5XI3IhCqoU+pb4Q7w0RbUqdA9orPvR7IimVAjLYGBwPhwEanF6keL+6qSCc1NJjQ3PwBM0+uDeW1zKQAAAABJRU5ErkJggg==) center/contain no-repeat; mask:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAALMSURBVFhHxZdJqM5RGMaveR5KhsiUoRAWikLCCikppIRrLGRYYCdJyoYsLLAQiqVYkczsLNiQKFnIWKaQ+afnOkfnPud8vu+i663f4v+8zznnvfd/znv+Xx1Q9z/JhOYmE5pID+Ao0KqQq4lMaCJb+BnzC7mayIQq9ANWAB2BzsCLUMDtkO8DLAO6F8YWyYQK6F99EHgJHANaADvC4jGWAm2B88AzYBfQvjBXIzKhwBzgOXAZmBi0DsBTK+BmMmZmeH4ITCjM+YtMMDYC34E1prcG7lsBVwrjdwLfgHmFXAOZkLA8TDy9kBNnrIBDBY/Qnqg4TyYERoVBcwu5yP5kccXmgiei3Gegp+fcGLkFHCnoKeutAO0V96RcB0667iYxC/gEdCnk3JfG6IInZXjwjUx1N4mL4ci57uyzAjYVPM4F4ECquaEr8Do5bpXoD7y3Ap6E5uTelMXhaKqPNGhumBy6W6fC4JQ9tniMdQVvyjDgDTAgam6oB+4WBjqngVPAjbDwWeBaeC3uTdEfpqY2JWpu2BBOgOvONmAqsCgUoFe2BFhV8KaogT0GZkfNDSuBB4WBjl6V9sFQ4G24A8YG3JuiPfIqbUpuUOIr0KswOCVuonHAB6C36ZWQX6HCGzQ3qFM   #bar .lpi { font:700 12px/16px system-ui; text-align:center; border-radius:3px; background:currentColor; } #bar .lpi { -webkit-text-fill-color:#000; }
  #bar a { flex:none; margin-left:auto; width:16px; height:16px; color:var(--mut); }
  #bar a svg { display:block; width:16px; height:16px; fill:currentColor; } #bar a:hover { color:var(--fg); }
  #log { height:calc(100% - 28px); overflow-y:auto; padding:6px 0 46px; }
  .m { display:flex; gap:6px; align-items:flex-start; padding:4px 10px 4px 8px; border-left:3px solid var(--c); word-break:break-word; }
  .m:hover { background:#1c1c21; }
  .tw { --c:var(--tw); } .yt { --c:var(--yt); } .kk { --c:var(--kk); } .tt { --c:var(--tt); } .se { --c:var(--se); } .lp { --c:var(--lp); }
  .ic { flex:none; width:16px; height:16px; margin-top:2px; border-radius:3px; background:var(--c);
    color:#000; font:700 10px/16px system-ui; text-align:center; }
  .em { flex:none; width:20px; text-align:center; }
  .body { min-width:0; flex:1; }
  .u { font-weight:700; }
  .t { color:var(--mut); }
  .v { color:#ffd33d; font-weight:700; }
  .d { display:block; font-size:12px; color:var(--mut); }
  .rp { flex:none; align-self:flex-start; width:24px; height:22px; padding:0; border:1px solid #4a4a55; border-radius:5px;
    background:#23232a; color:#e6e6ee; font:700 14px/20px system-ui; cursor:pointer; }
  .rp:hover:not(:disabled), .rp:focus-visible { color:#fff; background:#6d2fd6; border-color:#9b6bff; }
  .rp:disabled { cursor:default; opacity:.2; }
  .rp.ok { color:#3ddc84; opacity:1; } .rp.err { color:#ff6369; opacity:1; }
  #ctl { position:fixed; left:0; right:0; bottom:0; z-index:5; padding:6px 8px; background:var(--panel); border-top:1px solid #26262c;
    display:flex; gap:6px; align-items:center; }
  #ctl .r2 { display:contents; }
  #ctl button { font:600 12px/1.2 system-ui,"Segoe UI",sans-serif; min-height:26px; padding:3px 8px; border-radius:6px; cursor:pointer; white-space:nowrap;
    border:1px solid #3a3a42; background:#26262c; color:var(--fg); }
  #ctl button:hover:not(:disabled) { background:#2f2f37; }
  #ctl button:focus-visible { outline:2px solid #bf94ff; outline-offset:1px; }
  #ctl button:disabled { opacity:.55; cursor:default; }
  #pausa, #pular { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  #pausa { flex:1.5; }
  #fila { flex:none; color:var(--mut); font-size:11px; white-space:nowrap; }
  body.p #pausa { background:#f5a623; border-color:#ffc861; color:#1a1100; font-weight:800; letter-spacing:.2px; animation:pulso 1.6s ease-in-out infinite; }
  body.p #pausa:hover:not(:disabled) { background:#ffb84d; }
  body.p::after { content:""; position:fixed; inset:0; z-index:9; pointer-events:none; border:3px solid #f5a623; }
  @keyframes pulso { 50% { box-shadow:0 0 0 3px rgba(245,166,35,.45); } }
  @media (prefers-reduced-motion:reduce) { body.p #pausa { animation:none; } }
  .h { flex:none; font-size:11px; color:var(--mut); margin-top:2px; }
  #empty { color:var(--mut); text-align:center; margin-top:30px; }
</style>

<body>
<div id="bar"><span id="s-twitch" class="tw" title="Twitch" aria-label="Twitch"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg></span><span id="s-youtube" class="yt" title="YouTube" aria-label="YouTube"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg></span><span id="s-kick" class="kk" title="Kick" aria-label="Kick"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.333 0h8v5.333H12V2.667h2.667V0h8v8H20v2.667h-2.667v2.666H20V16h2.667v8h-8v-2.667H12v-2.666H9.333V24h-8Z"/></svg></span><span id="s-tiktok" class="tt" title="TikTok" aria-label="TikTok"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg></span><span id="s-streamelements" class="se" title="StreamElements" aria-label="StreamElements"><i class="logo-se"></i></span><span id="s-livepix" class="lp" title="LivePix" aria-label="LivePix"><b class="lpi">P</b></span> <div id="log"><div id="empty">Aguardando interações...</div></div>
<div id="ctl">
  <button type="button" id="pausa" aria-pressed="false">⏸ Pausar alertas</button>
  <div class="r2"><button type="button" id="pular" disabled title="Nenhum alerta em exibição">⏭ Pular alerta</button><span id="fila" role="status">fila: 0</span></div>
</div>
<script>
const log = document.getElementById('log');
const CLS = {twitch:'tw', youtube:'yt', kick:'kk', tiktok:'tt', streamelements:'se', livepix:'lp'};
const ICON = {twitch:'T', youtube:'Y', kick:'K', tiktok:'TT', streamelements:'$', livepix:'P'};
const NOME = {twitch:'Twitch', youtube:'YouTube', kick:'Kick', tiktok:'TikTok', streamelements:'StreamElements', livepix:'LivePix'};
const EMOJI = {'follow':'❤️', 'sub':'⭐', 'presente de sub':'🎁', 'bits':'💎', 'raid':'🚀', 'host':'🚀',
  'super chat':'💰', 'super sticker':'💰', 'membro':'🏅', 'presente de membro':'🏅', 'presente':'🎁',
  'assinatura':'⭐', 'kicks':'💚', 'doação':'💸', 'resgate':'🎟️'};
// tipos que geram alerta (espelha livehub/alertas/regras.py)
const ALERTA = new Set(['follow', 'sub', 'assinatura', 'membro', 'presente de sub', 'presente de membro', 'raid', 'host',
  'bits', 'kicks', 'presente', 'super sticker', 'doação', 'super chat']);
const MAX = 300;

function hora(ts) { const d = new Date(ts * 1000); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

// repetir: alerta na tela, som do resgate ou nada
function replayBtn(m) {
  const t = (m.tipo || '').toLowerCase();
  const url = ALERTA.has(t) ? '/api/alertas/repetir' : t === 'resgate' ? '/api/resgates/repetir' : null;
  const b = el('button', 'rp', '↻'); b.type = 'button';
  const dica = (txt) => { b.title = txt; b.setAttribute('aria-label', txt); };
  if (!url) { b.disabled = true; dica('Nada para repetir'); return b; }
  dica('Repetir');
  let livre = true;
  b.onclick = async () => {
    if (!livre) return;
    livre = false; setTimeout(() => livre = true, 1000);
    let ok = false, erro = 'Falhou';
    try {
      const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({seq: m.seq})});
      const j = await r.json().catch(() => ({}));
      ok = r.ok && j.ok !== false; if (!ok) erro = j.erro || (j.ok === false ? 'Fila cheia' : 'Falhou');
    } catch (e) { erro = 'Sem conexão'; }
    b.textContent = ok ? '✓' : '✗'; b.classList.add(ok ? 'ok' : 'err'); if (!ok) dica(erro);
    setTimeout(() => { b.textContent = '↻'; b.classList.remove('ok', 'err'); dica('Repetir'); }, 1200);
  };
  return b;
}

function render(m) {
  const row = el('div', 'm ' + (CLS[m.platform] || ''));
  const body = el('div', 'body');
  body.append(el('span', 'u', m.user || '?'), document.createTextNode(' '), el('span', 't', m.tipo || ''));
  if (m.valor) body.append(document.createTextNode(' '), el('span', 'v', m.valor));
  if (m.detalhe) body.append(el('span', 'd', m.detalhe));
  row.append(el('div', 'ic', ICON[m.platform] || '?'), el('div', 'em', EMOJI[m.tipo] || '•'), body);
  if (m.seq) row.append(replayBtn(m));
  row.append(el('div', 'h', hora(m.ts)));
  return row;
}

function add(m) {
  const e = document.getElementById('empty'); if (e) e.remove();
  log.prepend(render(m));
  while (log.children.length > MAX) log.removeChild(log.lastChild);
}

function setStatus(st) {
  for (const k of Object.keys(CLS)) {
    const el = document.getElementById('s-' + k); if (!el || !st[k]) continue;
    el.className = CLS[k] + ' ' + (/^conectado/.test(st[k]) ? 'on' : (/reconect|erro|inv/.test(st[k]) ? 'off' : ''));
    el.title = NOME[k] + ': ' + st[k];
  }
}

// ---- controles de alertas (estado vem do servidor e e difundido pelo WS) ----
const $ = id => document.getElementById(id);
let est = {pausado: false, fila: 0, atual: null}, bloqueioAte = 0, tick = null;
const post = (u, c) => fetch(u, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(c || {})});

function pintar() {
  const p = $('pausa');
  document.body.classList.toggle('p', !!est.pausado);
  p.setAttribute('aria-pressed', est.pausado ? 'true' : 'false');
  p.textContent = est.pausado ? '⏵ PAUSADO · Retomar' : '⏸ Pausar alertas';
  $('fila').textContent = 'fila: ' + (est.fila || 0);
  const resta = Math.ceil((bloqueioAte - Date.now()) / 1000), u = $('pular');
  if (resta > 0) { u.disabled = true; u.textContent = 'Aguarde ' + resta + 's…'; u.title = 'Aguarde para pular de novo'; }
  else {
    u.textContent = '⏭ Pular alerta'; u.disabled = !est.atual;
    u.title = est.atual ? 'Pular o alerta em exibição' : 'Nenhum alerta em exibição';
    if (tick) { clearInterval(tick); tick = null; }
  }
}
function aplicar(e) { if (e) { est = {...est, ...e}; pintar(); } }
function bloquear() { bloqueioAte = Date.now() + 3000; if (!tick) tick = setInterval(pintar, 250); pintar(); }
async function carregarEstado() { try { aplicar(await (await fetch('/api/alertas/estado')).json()); } catch (e) {} }
$('pausa').onclick = async () => {
  try { const r = await post('/api/alertas/pausar', {pausado: !est.pausado}); const j = await r.json(); if (r.ok) aplicar({pausado: j.pausado}); } catch (e) {}
};
$('pular').onclick = async () => {
  bloquear();
  try { await post('/api/alertas/pular'); } catch (e) {}
};
pintar(); carregarEstado();

function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/eventos/ws');
  ws.onmessage = ev => {
    const d = JSON.parse(ev.data);
    if (d.type === 'history') { log.replaceChildren(); d.eventos.forEach(add); setStatus(d.status); carregarEstado(); }
    else if (d.type === 'ev') add(d.ev);
    else if (d.type === 'status') setStatus(d.status);
    else if (d.type === 'alertas') aplicar({pausado: d.pausado, fila: d.fila, atual: d.atual});
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();
</script>
</body>
